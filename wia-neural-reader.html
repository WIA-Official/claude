<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 WIA Neural Code Reader - 차세대 코드 리더</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --wia-primary: #667eea;
            --wia-secondary: #764ba2;
            --wia-success: #4caf50;
            --wia-danger: #f44336;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .header {
            background: linear-gradient(135deg, var(--wia-primary), var(--wia-secondary));
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .scanner-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            color: var(--wia-primary);
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scan-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .scan-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scan-card:hover {
            border-color: var(--wia-primary);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-5px);
        }

        .scan-card.active {
            border-color: var(--wia-primary);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .scan-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        #videoPreview {
            width: 100%;
            max-width: 640px;
            height: 480px;
            background: #000;
            border-radius: 12px;
            margin: 20px auto;
            display: none;
        }

        #canvasPreview {
            width: 100%;
            max-width: 640px;
            height: 480px;
            border: 2px dashed #e9ecef;
            border-radius: 12px;
            margin: 20px auto;
            display: none;
            background: #f8f9fa;
        }

        .result-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-data {
            background: #f8f9fa;
            border-left: 4px solid var(--wia-success);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-wia {
            background: linear-gradient(135deg, var(--wia-primary), var(--wia-secondary));
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-wia:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-wia:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show { display: block; }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--wia-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .alert-success {
            background: var(--wia-success);
            color: white;
        }

        .alert-danger {
            background: var(--wia-danger);
            color: white;
        }

        .capture-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 5px solid var(--wia-primary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .capture-btn:hover {
            transform: translateX(-50%) scale(1.1);
        }

        .video-container {
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>🔍 WIA Neural Code Reader</h1>
            <p>차세대 WIA Neural Code를 스캔하고 데이터를 복원합니다</p>
        </div>

        <div class="content">
            <!-- 스캔 방법 선택 -->
            <div class="scanner-section">
                <h3 class="section-title">
                    <i class="fas fa-qrcode"></i>
                    스캔 방법 선택
                </h3>

                <div class="scan-methods">
                    <div class="scan-card" id="cameraCard">
                        <div class="scan-icon">📷</div>
                        <h4>카메라 스캔</h4>
                        <p>실시간 카메라로 스캔</p>
                    </div>

                    <div class="scan-card" id="uploadCard">
                        <div class="scan-icon">📁</div>
                        <h4>이미지 업로드</h4>
                        <p>저장된 이미지 불러오기</p>
                    </div>

                    <div class="scan-card" id="urlCard">
                        <div class="scan-icon">🔗</div>
                        <h4>URL로 불러오기</h4>
                        <p>이미지 URL 입력</p>
                    </div>
                </div>

                <!-- 파일 업로드 (숨김) -->
                <input type="file" id="fileInput" accept="image/*" style="display: none;">

                <!-- URL 입력 -->
                <div id="urlInputSection" style="display: none; margin-top: 20px;">
                    <div class="input-group">
                        <input type="url" id="imageUrl" class="form-control"
                               placeholder="이미지 URL을 입력하세요...">
                        <button class="btn btn-wia" id="loadUrlBtn">불러오기</button>
                    </div>
                </div>

                <!-- 비디오 미리보기 -->
                <div class="video-container" id="videoContainer">
                    <video id="videoPreview" autoplay playsinline></video>
                    <button class="capture-btn" id="captureBtn" style="display: none;">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>

                <!-- Canvas 미리보기 -->
                <canvas id="canvasPreview"></canvas>

                <!-- 로딩 -->
                <div class="loading" id="loadingSection">
                    <div class="spinner"></div>
                    <p>WIA Neural Code 스캔 중...</p>
                </div>

                <!-- 스캔 버튼 -->
                <div class="text-center" style="margin-top: 20px;">
                    <button class="btn btn-wia" id="scanBtn" style="display: none;">
                        <i class="fas fa-search"></i> 스캔 시작
                    </button>
                    <button class="btn btn-wia" id="stopCameraBtn" style="display: none;">
                        <i class="fas fa-stop"></i> 카메라 중지
                    </button>
                </div>
            </div>

            <!-- 결과 섹션 -->
            <div class="result-section" id="resultSection">
                <h3 class="section-title">
                    <i class="fas fa-check-circle"></i>
                    스캔 결과
                </h3>

                <div id="resultContent">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/wia-neural-encoder.js"></script>
    <script src="./assets/js/wia-neural-decoder.js"></script>
    <script src="./assets/js/wia-engine.js"></script>

    <script>
        class WIANeuralReader {
            constructor() {
                this.decoder = new WIANeuralDecoder();
                this.stream = null;
                this.canvas = document.getElementById('canvasPreview');
                this.ctx = this.canvas.getContext('2d');
                this.video = document.getElementById('videoPreview');

                this.init();
            }

            init() {
                console.log('🔍 WIA Neural Reader 초기화...');

                // 이벤트 리스너
                document.getElementById('cameraCard').addEventListener('click', () => {
                    this.selectMethod('camera');
                });

                document.getElementById('uploadCard').addEventListener('click', () => {
                    this.selectMethod('upload');
                });

                document.getElementById('urlCard').addEventListener('click', () => {
                    this.selectMethod('url');
                });

                document.getElementById('fileInput').addEventListener('change', (e) => {
                    this.handleFileUpload(e.target.files[0]);
                });

                document.getElementById('loadUrlBtn').addEventListener('click', () => {
                    this.loadFromUrl();
                });

                document.getElementById('scanBtn').addEventListener('click', () => {
                    this.scanCode();
                });

                document.getElementById('captureBtn').addEventListener('click', () => {
                    this.captureFromCamera();
                });

                document.getElementById('stopCameraBtn').addEventListener('click', () => {
                    this.stopCamera();
                });

                console.log('✅ WIA Neural Reader 준비 완료');
            }

            selectMethod(method) {
                // 모든 카드 비활성화
                document.querySelectorAll('.scan-card').forEach(card => {
                    card.classList.remove('active');
                });

                // 선택된 카드 활성화
                const cards = {
                    'camera': 'cameraCard',
                    'upload': 'uploadCard',
                    'url': 'urlCard'
                };
                document.getElementById(cards[method]).classList.add('active');

                // UI 초기화
                this.resetUI();

                // 방법별 처리
                switch (method) {
                    case 'camera':
                        this.startCamera();
                        break;
                    case 'upload':
                        document.getElementById('fileInput').click();
                        break;
                    case 'url':
                        document.getElementById('urlInputSection').style.display = 'block';
                        break;
                }
            }

            resetUI() {
                document.getElementById('videoPreview').style.display = 'none';
                document.getElementById('canvasPreview').style.display = 'none';
                document.getElementById('scanBtn').style.display = 'none';
                document.getElementById('captureBtn').style.display = 'none';
                document.getElementById('stopCameraBtn').style.display = 'none';
                document.getElementById('urlInputSection').style.display = 'none';
                document.getElementById('resultSection').classList.remove('show');
            }

            async startCamera() {
                try {
                    console.log('📷 카메라 시작...');

                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: 640, height: 480 }
                    });

                    this.video.srcObject = this.stream;
                    document.getElementById('videoPreview').style.display = 'block';
                    document.getElementById('captureBtn').style.display = 'block';
                    document.getElementById('stopCameraBtn').style.display = 'inline-block';

                    console.log('✅ 카메라 시작 완료');

                } catch (error) {
                    console.error('❌ 카메라 오류:', error);
                    alert('카메라 접근 권한이 필요합니다.');
                }
            }

            stopCamera() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                    document.getElementById('videoPreview').style.display = 'none';
                    document.getElementById('captureBtn').style.display = 'none';
                    document.getElementById('stopCameraBtn').style.display = 'none';
                    console.log('🛑 카메라 중지');
                }
            }

            captureFromCamera() {
                const video = this.video;
                const canvas = this.canvas;
                const ctx = this.ctx;

                // Canvas 크기 설정
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // 비디오 프레임 캡처
                ctx.drawImage(video, 0, 0);

                // Canvas 표시
                document.getElementById('canvasPreview').style.display = 'block';
                document.getElementById('scanBtn').style.display = 'inline-block';

                console.log('📸 프레임 캡처 완료');
            }

            async handleFileUpload(file) {
                if (!file) return;

                try {
                    console.log('📁 파일 업로드:', file.name);

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            // Canvas에 이미지 그리기
                            this.canvas.width = img.width;
                            this.canvas.height = img.height;
                            this.ctx.drawImage(img, 0, 0);

                            document.getElementById('canvasPreview').style.display = 'block';
                            document.getElementById('scanBtn').style.display = 'inline-block';

                            console.log('✅ 이미지 로드 완료');
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);

                } catch (error) {
                    console.error('❌ 파일 업로드 오류:', error);
                    alert('파일을 읽을 수 없습니다.');
                }
            }

            async loadFromUrl() {
                const url = document.getElementById('imageUrl').value;
                if (!url) {
                    alert('URL을 입력하세요.');
                    return;
                }

                try {
                    console.log('🔗 URL 로드:', url);

                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        this.canvas.width = img.width;
                        this.canvas.height = img.height;
                        this.ctx.drawImage(img, 0, 0);

                        document.getElementById('canvasPreview').style.display = 'block';
                        document.getElementById('scanBtn').style.display = 'inline-block';

                        console.log('✅ URL 이미지 로드 완료');
                    };
                    img.onerror = () => {
                        alert('이미지를 불러올 수 없습니다. URL을 확인하세요.');
                    };
                    img.src = url;

                } catch (error) {
                    console.error('❌ URL 로드 오류:', error);
                    alert('URL을 불러올 수 없습니다.');
                }
            }

            async scanCode() {
                const loadingSection = document.getElementById('loadingSection');
                const resultSection = document.getElementById('resultSection');

                try {
                    console.log('🔍 스캔 시작...');

                    loadingSection.classList.add('show');

                    // 디코딩 실행
                    const result = await this.decoder.decode(this.canvas);

                    console.log('✅ 스캔 완료:', result);

                    // 결과 표시
                    this.displayResult(result);

                    resultSection.classList.add('show');

                } catch (error) {
                    console.error('❌ 스캔 오류:', error);
                    alert('WIA Neural Code를 읽을 수 없습니다.\n\n' + error.message);
                } finally {
                    loadingSection.classList.remove('show');
                }
            }

            displayResult(result) {
                const container = document.getElementById('resultContent');

                const typeIcons = {
                    'text': '📝',
                    'link': '🔗',
                    'wifi': '📶',
                    'vcard': '👤',
                    'email': '📧',
                    'phone': '📞',
                    'sms': '💬',
                    'whatsapp': '💚',
                    'gps': '🌍',
                    'human': '🧠'
                };

                const icon = typeIcons[result.type] || '📄';

                let dataHtml = '';

                if (typeof result.data === 'object') {
                    dataHtml = '<dl class="row">';
                    for (const [key, value] of Object.entries(result.data)) {
                        dataHtml += `
                            <dt class="col-sm-3">${key}</dt>
                            <dd class="col-sm-9">${value}</dd>
                        `;
                    }
                    dataHtml += '</dl>';
                } else {
                    dataHtml = `<p>${result.data}</p>`;
                }

                container.innerHTML = `
                    <div class="alert alert-success">
                        <h4>${icon} ${result.type.toUpperCase()} 데이터 감지됨</h4>
                    </div>

                    <div class="result-data">
                        ${dataHtml}
                    </div>

                    <div class="result-actions">
                        ${this.generateActionButtons(result)}
                    </div>
                `;
            }

            generateActionButtons(result) {
                let buttons = '';

                switch (result.type) {
                    case 'link':
                        buttons = `<a href="${result.data}" target="_blank" class="btn btn-wia">
                            <i class="fas fa-external-link-alt"></i> 링크 열기
                        </a>`;
                        break;

                    case 'wifi':
                        buttons = `<button class="btn btn-wia" onclick="alert('WiFi 정보가 클립보드에 복사되었습니다.')">
                            <i class="fas fa-wifi"></i> WiFi 연결
                        </button>`;
                        break;

                    case 'email':
                        buttons = `<a href="mailto:${result.data.email}" class="btn btn-wia">
                            <i class="fas fa-envelope"></i> 이메일 보내기
                        </a>`;
                        break;

                    case 'phone':
                        buttons = `<a href="tel:${result.data}" class="btn btn-wia">
                            <i class="fas fa-phone"></i> 전화 걸기
                        </a>`;
                        break;

                    case 'sms':
                        buttons = `<a href="sms:${result.data.phone}" class="btn btn-wia">
                            <i class="fas fa-sms"></i> 문자 보내기
                        </a>`;
                        break;

                    case 'whatsapp':
                        buttons = `<a href="${result.data}" target="_blank" class="btn btn-wia">
                            <i class="fab fa-whatsapp"></i> WhatsApp 열기
                        </a>`;
                        break;
                }

                buttons += `
                    <button class="btn btn-outline-secondary" onclick="navigator.clipboard.writeText('${JSON.stringify(result.data)}')">
                        <i class="fas fa-copy"></i> 복사
                    </button>
                `;

                return buttons;
            }
        }

        // 앱 시작
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 WIA Neural Reader 시작...');
            new WIANeuralReader();
        });
    </script>
</body>
</html>
