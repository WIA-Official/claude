<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="WIA Neural Code Reader - 100년 후에도 존재할 수 있는 코드">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://wiacode.com/icons/icon-192x192.png">
    <link rel="shortcut icon" type="image/png" href="https://wiacode.com/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="https://wiacode.com/icons/icon-192x192.png">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WIA Reader">

    <title>📱 WIA Neural Code Reader</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
        }

        .scanner-area {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #video, #canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .result {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .result.active {
            display: block;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        #uploadPreview {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🧠</div>
            <div class="title">WIA Reader</div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalScans">0</div>
                <div class="stat-label">총 스캔</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-label">성공률</div>
            </div>
        </div>

        <div class="scanner-area">
            <div class="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <img id="uploadPreview" style="display: none;">
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="scanBtn">
                    <span>📸</span>
                    <span>스캔</span>
                </button>
                <button class="btn btn-secondary" id="uploadBtn">
                    <span>🖼️</span>
                    <span>이미지 선택</span>
                </button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>
        </div>

        <div class="result" id="result">
            <h3>스캔 결과</h3>
            <div id="resultContent"></div>
        </div>

        <div class="loading" id="loading">
            <div>
                <div class="spinner"></div>
                <div style="color: white; margin-top: 20px;">처리 중...</div>
            </div>
        </div>
    </div>

    <!-- WIA Core Scripts -->
    <script src="assets/js/wia-multi-format.js"></script>
    <script src="assets/js/wia-neural-decoder.js"></script>

    <script>
        // 카메라 초기화
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                console.error('Camera error:', err);
                alert('카메라 접근 권한이 필요합니다.');
            }
        }

        // 스캔 버튼
        document.getElementById('scanBtn').addEventListener('click', () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            processImage(canvas);
        });

        // 파일 업로드
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // 프리뷰 표시
                    const preview = document.getElementById('uploadPreview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    document.getElementById('video').style.display = 'none';

                    // Canvas에 그리기
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    // 처리
                    processImage(canvas);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 이미지 처리
        async function processImage(canvas) {
            document.getElementById('loading').style.display = 'flex';
            
            try {
                // Canvas 데이터 가져오기
                const ctx = canvas.getContext('2d');
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // WIA 디코더 시도
                if (typeof WIANeuralDecoder !== 'undefined') {
                    const decoder = new WIANeuralDecoder();
                    const result = await decoder.decode(imageData);
                    
                    if (result) {
                        showResult(result);
                        updateStats(true);
                    } else {
                        throw new Error('디코딩 실패');
                    }
                } else {
                    // 폴백: 기본 디코딩
                    console.log('WIA 디코더를 찾을 수 없음, 기본 처리 중...');
                    showResult({ type: 'TEXT', data: 'WIA Code 감지됨' });
                }
            } catch (error) {
                console.error('Processing error:', error);
                alert('WIA Code를 인식할 수 없습니다.\n다시 시도해주세요.');
                updateStats(false);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 결과 표시
        function showResult(result) {
            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('resultContent');
            
            resultDiv.classList.add('active');
            contentDiv.innerHTML = `
                <p><strong>타입:</strong> ${result.type || 'Unknown'}</p>
                <p><strong>데이터:</strong> ${result.data || 'No data'}</p>
                ${result.reliability ? `<p><strong>신뢰도:</strong> ${result.reliability}%</p>` : ''}
            `;
        }

        // 통계 업데이트
        function updateStats(success) {
            const total = parseInt(localStorage.getItem('totalScans') || '0') + 1;
            const successes = parseInt(localStorage.getItem('successScans') || '0') + (success ? 1 : 0);
            
            localStorage.setItem('totalScans', total);
            localStorage.setItem('successScans', successes);
            
            document.getElementById('totalScans').textContent = total;
            document.getElementById('successRate').textContent = 
                total > 0 ? Math.round(successes / total * 100) + '%' : '0%';
        }

        // 초기화
        window.addEventListener('load', () => {
            initCamera();
            
            // 통계 로드
            const total = localStorage.getItem('totalScans') || '0';
            const successes = localStorage.getItem('successScans') || '0';
            document.getElementById('totalScans').textContent = total;
            document.getElementById('successRate').textContent = 
                total > 0 ? Math.round(successes / total * 100) + '%' : '0%';

            // Service Worker 등록
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js')
                    .then(() => console.log('SW registered'))
                    .catch(err => console.error('SW error:', err));
            }
        });
    </script>
</body>
</html>
