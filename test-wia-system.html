<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 WIA Neural Code - 시스템 테스트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .test-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            text-align: center;
        }

        h2 {
            color: #764ba2;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 10px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        canvas {
            border: 2px dashed #ccc;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            background: white;
        }

        .controls {
            margin: 20px 0;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .result {
            background: #f8f9fa;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44336;
        }

        .log {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #eee;
        }

        .log-entry.success { color: #4caf50; }
        .log-entry.error { color: #f44336; }
        .log-entry.info { color: #2196f3; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>🧪 WIA Neural Code - 전체 시스템 테스트</h1>

    <!-- 테스트 1: 인코딩 -->
    <div class="test-section">
        <h2>1️⃣ 인코딩 테스트</h2>

        <div class="controls">
            <select id="testDataType">
                <option value="text">텍스트</option>
                <option value="link">링크</option>
                <option value="wifi">WiFi</option>
                <option value="vcard">vCard</option>
                <option value="email">이메일</option>
                <option value="phone">전화</option>
            </select>

            <input type="text" id="testData" placeholder="테스트 데이터 입력..." style="padding: 10px; width: 300px; border-radius: 20px; border: 2px solid #ddd;">

            <button onclick="testEncode()">🔐 인코딩 테스트</button>
        </div>

        <div class="test-grid">
            <div>
                <h4>생성된 WIA Neural Code</h4>
                <canvas id="encodeCanvas" width="400" height="400"></canvas>
            </div>
            <div>
                <h4>인코딩 결과</h4>
                <div id="encodeResult" class="result">
                    대기 중...
                </div>
            </div>
        </div>
    </div>

    <!-- 테스트 2: 디코딩 -->
    <div class="test-section">
        <h2>2️⃣ 디코딩 테스트</h2>

        <div class="controls">
            <button onclick="testDecode()">🔓 디코딩 테스트 (위 캔버스 사용)</button>
        </div>

        <div id="decodeResult" class="result">
            대기 중...
        </div>
    </div>

    <!-- 테스트 3: 전체 사이클 -->
    <div class="test-section">
        <h2>3️⃣ 전체 사이클 테스트 (생성 → 읽기)</h2>

        <div class="controls">
            <button onclick="runFullCycleTest()">🔄 전체 사이클 테스트</button>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalTests">0</div>
                <div class="stat-label">총 테스트</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successTests">0</div>
                <div class="stat-label">성공</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failedTests">0</div>
                <div class="stat-label">실패</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">정확도</div>
            </div>
        </div>

        <div class="log" id="testLog">
            <div class="log-entry info">시스템 준비 완료. 테스트를 시작하세요.</div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./assets/js/wia-neural-encoder.js"></script>
    <script src="./assets/js/wia-neural-decoder.js"></script>
    <script src="./assets/js/wia-engine.js"></script>

    <script>
        // 전역 변수
        let encoder = null;
        let decoder = null;
        let engine = null;
        let lastPattern = null;
        let testStats = {
            total: 0,
            success: 0,
            failed: 0
        };

        // 초기화
        function init() {
            try {
                encoder = new WIANeuralEncoder();
                decoder = new WIANeuralDecoder();

                const canvas = document.getElementById('encodeCanvas');
                engine = new WIANeuralEngine(canvas);

                log('✅ 모든 엔진 초기화 완료', 'success');
            } catch (error) {
                log('❌ 초기화 실패: ' + error.message, 'error');
            }
        }

        // 인코딩 테스트
        function testEncode() {
            try {
                const dataType = document.getElementById('testDataType').value;
                const data = document.getElementById('testData').value || '테스트 데이터';

                log(`🔐 인코딩 시작: ${dataType} - ${data}`, 'info');

                // 데이터 포맷
                const formattedData = formatTestData(dataType, data);

                // 인코딩
                lastPattern = encoder.encode(dataType, formattedData);

                // 렌더링
                engine.generate(data, 'triangle', 'high');

                // 결과 표시
                const resultDiv = document.getElementById('encodeResult');
                resultDiv.className = 'result';
                resultDiv.innerHTML = `
                    <strong>✅ 인코딩 성공!</strong><br>
                    <strong>타입:</strong> ${dataType}<br>
                    <strong>데이터 크기:</strong> ${lastPattern.metadata.dataSize} bytes<br>
                    <strong>인코딩 크기:</strong> ${lastPattern.metadata.encodedSize} bytes<br>
                    <strong>뉴런 수:</strong> ${lastPattern.neurons.length}<br>
                    <strong>연결선 수:</strong> ${lastPattern.connections.length}
                `;

                log(`✅ 인코딩 성공: ${lastPattern.metadata.dataSize} bytes → ${lastPattern.neurons.length} neurons`, 'success');

            } catch (error) {
                log('❌ 인코딩 실패: ' + error.message, 'error');
                document.getElementById('encodeResult').className = 'result error';
                document.getElementById('encodeResult').innerHTML = '<strong>❌ 오류:</strong> ' + error.message;
            }
        }

        // 디코딩 테스트
        async function testDecode() {
            try {
                log('🔓 디코딩 시작...', 'info');

                const canvas = document.getElementById('encodeCanvas');
                const result = await decoder.decode(canvas);

                const resultDiv = document.getElementById('decodeResult');
                resultDiv.className = 'result';
                resultDiv.innerHTML = `
                    <strong>✅ 디코딩 성공!</strong><br>
                    <strong>타입:</strong> ${result.type}<br>
                    <strong>데이터:</strong> <pre>${JSON.stringify(result.data, null, 2)}</pre>
                `;

                log(`✅ 디코딩 성공: ${result.type}`, 'success');

            } catch (error) {
                log('❌ 디코딩 실패: ' + error.message, 'error');
                document.getElementById('decodeResult').className = 'result error';
                document.getElementById('decodeResult').innerHTML = '<strong>❌ 오류:</strong> ' + error.message;
            }
        }

        // 전체 사이클 테스트
        async function runFullCycleTest() {
            log('🔄 전체 사이클 테스트 시작...', 'info');

            const testCases = [
                { type: 'text', data: { content: 'Hello WIA Neural Code!' } },
                { type: 'link', data: { content: 'https://wiacode.com' } },
                { type: 'wifi', data: { ssid: 'TestWiFi', password: 'test123', security: 'WPA' } },
                { type: 'email', data: { email: 'test@wia.com', subject: 'Test', body: 'Hello' } },
                { type: 'phone', data: { content: 'tel:+82-10-1234-5678' } }
            ];

            for (const testCase of testCases) {
                try {
                    testStats.total++;

                    // 1. 인코딩
                    const pattern = encoder.encode(testCase.type, testCase.data);
                    engine.generate(JSON.stringify(testCase.data), 'triangle', 'high');

                    // 2. 디코딩
                    const canvas = document.getElementById('encodeCanvas');
                    const decoded = await decoder.decode(canvas);

                    // 3. 검증
                    const isMatch = decoded.type === testCase.type;

                    if (isMatch) {
                        testStats.success++;
                        log(`✅ 테스트 통과: ${testCase.type}`, 'success');
                    } else {
                        testStats.failed++;
                        log(`❌ 테스트 실패: ${testCase.type} (예상: ${testCase.type}, 실제: ${decoded.type})`, 'error');
                    }

                    // 짧은 대기
                    await new Promise(resolve => setTimeout(resolve, 500));

                } catch (error) {
                    testStats.failed++;
                    log(`❌ 테스트 오류: ${testCase.type} - ${error.message}`, 'error');
                }
            }

            // 통계 업데이트
            updateStats();

            log('🏁 전체 사이클 테스트 완료', 'info');
        }

        // 통계 업데이트
        function updateStats() {
            document.getElementById('totalTests').textContent = testStats.total;
            document.getElementById('successTests').textContent = testStats.success;
            document.getElementById('failedTests').textContent = testStats.failed;

            const accuracy = testStats.total > 0
                ? Math.round((testStats.success / testStats.total) * 100)
                : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        // 로그 출력
        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;

            console.log(message);
        }

        // 테스트 데이터 포맷
        function formatTestData(type, data) {
            switch (type) {
                case 'text':
                    return { content: data };
                case 'link':
                    return { content: data.startsWith('http') ? data : 'https://' + data };
                case 'wifi':
                    return { ssid: data, password: 'password123', security: 'WPA' };
                case 'email':
                    return { email: data, subject: 'Test', body: 'Test message' };
                case 'phone':
                    return { content: 'tel:' + data };
                default:
                    return { content: data };
            }
        }

        // 페이지 로드 시 초기화
        window.addEventListener('DOMContentLoaded', () => {
            log('🚀 WIA Neural Code 테스트 시스템 시작...', 'info');
            init();
        });
    </script>
</body>
</html>
