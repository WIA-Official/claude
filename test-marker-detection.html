<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 WIA 마커 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        canvas {
            border: 3px solid #667eea;
            background: white;
            display: block;
            width: 100%;
            max-width: 480px;
            height: auto;
            border-radius: 8px;
            margin: 15px auto;
        }

        .debug {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        .debug h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .debug pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .success {
            color: #28a745;
            font-weight: bold;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            margin: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        input[type="file"] {
            display: block;
            margin: 15px 0;
            padding: 10px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            background: #f8f9fa;
        }

        input[type="file"]:hover {
            background: #e9ecef;
        }

        .marker-legend {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .marker-item {
            text-align: center;
        }

        .marker-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 auto 5px;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .marker-label {
            font-size: 12px;
            font-weight: 600;
            color: #495057;
        }

        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 WIA Neural Code 마커 감지 테스트</h1>

        <div class="marker-legend">
            <div class="marker-item">
                <div class="marker-color" style="background: rgb(255, 0, 110);"></div>
                <div class="marker-label">Top (핑크)</div>
            </div>
            <div class="marker-item">
                <div class="marker-color" style="background: rgb(0, 180, 216);"></div>
                <div class="marker-label">Left (하늘)</div>
            </div>
            <div class="marker-item">
                <div class="marker-color" style="background: rgb(114, 9, 183);"></div>
                <div class="marker-label">Right (보라)</div>
            </div>
        </div>

        <div class="row">
            <div class="card">
                <h2>1️⃣ Generator 미리보기</h2>
                <canvas id="genCanvas" width="480" height="480"></canvas>
                <div style="text-align: center;">
                    <button onclick="generateTest()">🎨 재생성</button>
                    <button onclick="downloadCanvas('genCanvas')">💾 다운로드</button>
                </div>
            </div>

            <div class="card">
                <h2>2️⃣ Scanner 테스트</h2>
                <input type="file" id="fileInput" accept="image/*">
                <canvas id="scanCanvas" width="480" height="480"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="debug" id="debugInfo">
                <h3>📊 디버그 정보</h3>
                <pre id="debugContent">테스트를 시작하세요...</pre>
            </div>
        </div>
    </div>

    <script src="assets/js/wia-engine.js"></script>
    <script src="assets/js/wia-neural-encoder.js"></script>
    <script src="assets/js/wia-neural-decoder.js"></script>

    <script>
        let engine, encoder, decoder;

        function init() {
            const canvas = document.getElementById('genCanvas');
            encoder = new WIANeuralEncoder();
            engine = new WIANeuralEngine(canvas);
            decoder = new WIANeuralDecoder();

            generateTest();
        }

        function generateTest() {
            const canvas = document.getElementById('genCanvas');
            const ctx = canvas.getContext('2d');

            // 배경 흰색
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 간단한 텍스트 인코딩
            const testData = '마커 테스트 - 상단중앙(핑크), 좌하단(하늘), 우하단(보라)';
            engine.generate(testData, 'triangle', 'high');

            updateDebug(`✅ Generator 실행 완료

마커 위치:
- Top: 가로 중앙, 상단 30px (핑크 #ff006e)
- Left: 좌측 30px, 하단 30px (하늘 #00b4d8)
- Right: 우측 30px, 하단 30px (보라 #7209b7)

테스트 데이터: "${testData}"`);
        }

        function downloadCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = 'wia-marker-test.png';
            link.href = canvas.toDataURL();
            link.click();
            updateDebug('💾 이미지 다운로드 완료');
        }

        function updateDebug(message) {
            document.getElementById('debugContent').textContent = message;
        }

        // 파일 업로드 테스트
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            updateDebug('🔄 이미지 로딩 중...');

            const img = new Image();
            img.onload = async () => {
                const scanCanvas = document.getElementById('scanCanvas');
                const ctx = scanCanvas.getContext('2d');

                scanCanvas.width = img.width;
                scanCanvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imageData = ctx.getImageData(0, 0, img.width, img.height);

                try {
                    updateDebug('🔍 마커 감지 시작...');

                    const markers = decoder.detectMarkers(imageData);

                    // 발견된 마커 위치에 초록색 표시
                    markers.forEach(m => {
                        ctx.strokeStyle = 'lime';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(m.x - 40, m.y - 40, 80, 80);

                        ctx.fillStyle = 'lime';
                        ctx.font = 'bold 18px monospace';
                        ctx.fillText(`✓ ${m.name}`, m.x - 30, m.y - 45);
                    });

                    updateDebug(`✅ 마커 감지 성공!

발견된 마커: ${markers.length}/3

${markers.map(m => `
${m.name}:
  위치: (${m.x}, ${m.y})
  색상: rgb(${m.color.r}, ${m.color.g}, ${m.color.b})
`).join('\n')}

전체 디코딩 시작...`);

                    // 전체 디코딩 시도
                    try {
                        const result = await decoder.decode(scanCanvas);
                        updateDebug(`✅✅ 전체 디코딩 성공!

데이터 타입: ${result.type}
데이터: ${JSON.stringify(result.data, null, 2)}

마커 정보:
${markers.map(m => `  ${m.name}: (${m.x}, ${m.y}) rgb(${m.color.r}, ${m.color.g}, ${m.color.b})`).join('\n')}

뉴런 수: ${result.neuronCount}
연결선 수: ${result.connectionCount}`);
                    } catch (decodeError) {
                        updateDebug(`✅ 마커 감지 성공! (${markers.length}/3)
❌ 전체 디코딩 실패

마커 정보:
${markers.map(m => `  ${m.name}: (${m.x}, ${m.y})`).join('\n')}

디코딩 오류: ${decodeError.message}`);
                    }

                } catch (error) {
                    updateDebug(`❌ 마커 감지 실패

에러: ${error.message}

${error.stack}`);

                    // 예상 위치에 빨간색 표시 (디버깅용)
                    const w = scanCanvas.width;
                    const h = scanCanvas.height;
                    const expected = [
                        { name: 'top', x: w/2, y: 30, color: 'rgb(255, 0, 110)' },
                        { name: 'left', x: 30, y: h-30, color: 'rgb(0, 180, 216)' },
                        { name: 'right', x: w-30, y: h-30, color: 'rgb(114, 9, 183)' }
                    ];

                    expected.forEach(m => {
                        ctx.strokeStyle = 'red';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([5, 5]);
                        ctx.strokeRect(m.x - 40, m.y - 40, 80, 80);

                        ctx.fillStyle = 'red';
                        ctx.font = 'bold 16px monospace';
                        ctx.fillText(`? ${m.name}`, m.x - 30, m.y - 45);

                        // 예상 색상 표시
                        ctx.fillStyle = m.color;
                        ctx.fillRect(m.x - 5, m.y - 5, 10, 10);
                    });

                    ctx.setLineDash([]);
                }
            };

            img.onerror = () => {
                updateDebug('❌ 이미지 로딩 실패');
            };

            img.src = URL.createObjectURL(file);
        });

        // 초기화
        window.onload = init;
    </script>
</body>
</html>
