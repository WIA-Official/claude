<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="60" fill="url(#bg)"/>
  
  <!-- Neural Network Symbol -->
  <g transform="translate(256,256)">
    <!-- Center node -->
    <circle cx="0" cy="0" r="25" fill="white"/>
    
    <!-- Outer nodes -->
    <circle cx="-120" cy="-120" r="20" fill="white"/>
    <circle cx="120" cy="-120" r="20" fill="white"/>
    <circle cx="-120" cy="120" r="20" fill="white"/>
    <circle cx="120" cy="120" r="20" fill="white"/>
    <circle cx="0" cy="-150" r="20" fill="white"/>
    <circle cx="0" cy="150" r="20" fill="white"/>
    <circle cx="-150" cy="0" r="20" fill="white"/>
    <circle cx="150" cy="0" r="20" fill="white"/>
    
    <!-- Connections -->
    <line x1="0" y1="0" x2="-120" y2="-120" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="120" y2="-120" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="-120" y2="120" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="120" y2="120" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="-150" y2="0" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="150" y2="0" stroke="white" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- WIA Text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">WIA</text>
</svg>
